[build]
  command = "node scripts/check-deployment.cjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/model-config.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/refined1024.onnx"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=0, must-revalidate"
